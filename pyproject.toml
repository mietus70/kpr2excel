[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kpir-converter"
version = "0.1.0"
description = "Lokalny konwerter KPiR PDF -> XLSX (offline)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "reportlab>=4.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
kpir-api = "kpir_converter.main:run_api"
kpir-worker = "kpir_converter.worker.runner:run_worker"
kpir-extract = "kpir_converter.cli:main"

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend/src"
ignore_missing_imports = true
warn_unused_ignores = true
